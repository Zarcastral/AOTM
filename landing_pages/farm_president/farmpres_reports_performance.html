<!DOCTYPE html>
<html lang="en">

<head>
  <script type="module" src="/src/js/farm_president/farmpres_reports_performance.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmers Management</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style/farm_president/farmpres_reports_performance.css">
</head>

<body>
<!-- Placeholder for Header -->
<div id="header-container"></div>

<!-- Main Content -->
<div class="main-content">
    <div class="report-selector">
      <span class="harvest-form"><a href="farmpres_reports.html">Harvest</a></span> <div class="rando-line">|</div>
      <span class="performance-form"><a href="farmpres_reports_performance.html">Performance</a>
    </div>
  <div class="panel">
    <div class="table-wrapper">
      <h2>Performance Report</h2>
        <div class="performance-search-bar">
          <div class="search-and-dropdowns">
            <input type="text" id="performance-search-bar" placeholder="Search">
          </div>
            <div class="refresh-button">
          <span id="latest-record-timestamp">Latest Record Date and Time:</span>
          <button class="refresh-btn" id="pull-latest-btn">Pull Latest Record</button>
        </div>
      </div>
      <div class="performance_table">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Farmer Name</th>
              <th>Barangay</th>
              <th>Attendance</th>
              <th>Productivity Percentage</th>
              <th>Remarks</th>
            </tr>
          </thead>
          <tbody>
            <!-- Performance records will be populated here -->
          </tbody>
        </table>
      </div>
    </div>
      <div class="performance-pagination">
        <span id="performance-page-number">Page 1</span>
        <button id="performance-prev-page" class="performance-pagination-btn" disabled>&lt;</button>
        <button id="performance-next-page" class="performance-pagination-btn">&gt;</button>
      </div>
    
  </div>
  <!-- Download Button -->
  <div class="button-container">
    <button class="download-btn" id="download-btn">
      <img src="/images/DownloadPDF.png" alt="Download-btn Icon" class="download-icon">
      <span>Generate PDF</span>
    </button>
  </div>
  <div id="pdf-preview-panel" class="pdf-preview-panel">
    <div id="pdf-preview-container">
      <!-- The PDF preview will be rendered here -->
    </div>
    <div class="preview-buttons">
      <button id="preview-cancel-btn" class="preview-btn cancel-btn">Cancel</button>
      <button id="preview-done-btn" class="preview-btn done-btn">Download PDF</button>
    </div>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
      const reportLinks = document.querySelectorAll(".report-selector a");

      // Debugging: Log all links and their hrefs

      // Clear any active link state when the page is loaded
      reportLinks.forEach(link => link.classList.remove("active"));

      // Retrieve stored active link from localStorage
      const activeLink = localStorage.getItem("activeReportLink");

      // Normalize URLs for comparison (remove trailing slashes, etc.)
      const normalizeUrl = (url) => {
          try {
              return new URL(url, window.location.origin).href;
          } catch (e) {
              return url;
          }
      };

      // Get the current page URL
      const currentPageUrl = normalizeUrl(window.location.href);

      // Find the link that matches the current page
      let currentPageLink = null;
      reportLinks.forEach(link => {
          const normalizedLinkHref = normalizeUrl(link.href);
          if (normalizedLinkHref === currentPageUrl) {
              currentPageLink = link;
          }
      });

      // If the current page matches a link, set it as active and update localStorage
      if (currentPageLink) {
          currentPageLink.classList.add("active");
          localStorage.setItem("activeReportLink", currentPageLink.href);
      } else {
          // If no match for the current page, fall back to the stored active link
          let isMatchFound = false;
          if (activeLink) {
              reportLinks.forEach(link => {
                  const normalizedLinkHref = normalizeUrl(link.href);
                  const normalizedActiveLink = normalizeUrl(activeLink);
                  if (normalizedLinkHref === normalizedActiveLink) {
                      link.classList.add("active");
                      isMatchFound = true;
                  }
              });
          }

          // If no match for the stored active link, reset to Harvest
          if (!isMatchFound) {
              const harvestLink = Array.from(reportLinks).find(link =>
                  normalizeUrl(link.href).includes("farmpres_reports_performance.html")
              );
              if (harvestLink) {
                  harvestLink.classList.add("active");
                  localStorage.setItem("activeReportLink", harvestLink.href);
              } else {
              }
          }
      }

      // Add click event listeners to update the active link
      reportLinks.forEach(link => {
          link.addEventListener("click", function () {
              // Remove active class from all links
              reportLinks.forEach(link => link.classList.remove("active"));

              // Add active class to clicked link
              this.classList.add("active");

              // Store the active link in localStorage
              localStorage.setItem("activeReportLink", this.href);
          });
      });
  });
</script>
  <script type="module" src="/src/auth/header.js"></script>
</body>

</html>
