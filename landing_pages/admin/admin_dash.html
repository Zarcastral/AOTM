<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="/src/js/admin/admin_dash.js"></script>
  <title>Organic Baras Productivity</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style/admin/admin_dash.css">
</head>

<body>

  <!-- Placeholder for Header -->
  <div id="header-container"></div> <!-- This will hold the header content dynamically -->


  <div class="main-content">
    <!-- Top Section: System Stats and Performance Status -->
    <div class="top-section">
      <!-- System Stats Section -->
      <div class="system-stats-section">
        <h4 class="section-title">SYSTEM</h4>
        <div class="system-stats">
          <!-- Inside the stats-card for farmers -->
          <div class="stats-card">
            <img src="/images/profile-2userBig.png" alt="Farmers Icon" class="stats-icon farmers-icon">
            <div class="stats-info">
              <p>Farmers</p>
              <div class="number-wrapper total-farmers">
                <div class="change-indicators">
                  <span id="new-farmers" class="new-farmers"></span>
                </div>
                <h3 id="total-farmers"></h3>
                <span>This Year</span>
              </div>
            </div>
          </div>

          <div class="stats-card">
            <img src="/images/graphBig.png" alt="Projects Icon" class="stats-icon projects-icon">
            <div class="stats-info">
              <p>Projects</p>
              <div class="number-wrapper">
                <h3 id="total-projects"></h3>
                <span>This Month</span>
              </div>
            </div>
          </div>
        </div>
      </div>

<!-- Performance Status Section -->
<div class="performance-status-section">
  <h4 class="section-title">PERFORMANCE STATUS</h4>
  <div class="performance-status-card" style="display:flex; align-items:center; gap:30px;">
    <div id="overall-performance"></div>
    <!-- Chart -->
    <canvas id="performancePie" width="220" height="220"></canvas>
    
    <!-- Legend -->
    <div id="performanceLegend"></div>
  </div>
</div>



    </div> <!-- /top-section -->

    <!-- Project Status Section (moved above Analytics) -->
    <div class="project-status-section">
      <h4 class="section-title">PROJECT STATUS (THIS YEAR)</h4>
      <div class="project-status">
        <div class="status-circles">
          <div class="circle completed">
            <span id="total-completed-projects"></span>
            <p>Completed</p>
          </div>
          <div class="circle in-progress">
            <span id="total-inprogress-projects"></span>
            <p>In Progress</p>
          </div>
          <div class="circle not-started">
            <span id="total-notstarted-projects"></span>
            <p>Not Started</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Analytics Section -->
    <div class="analytics-section">
      <h4 class="section-title">ANALYTICS</h4>
      <div class="analytics">
        <div class="harvest-info">
          <div class="year-selector-wrapper">
            <h5>Harvest Information</h5>
            <div class="year-selector-container">
              <label for="year-selector" class="year-selector-label">Select a Year:</label>
              <select id="year-selector" class="year-selector">
                <!-- Years will be populated dynamically -->
              </select>
            </div>
          </div>

          <div class="chart-wrapper">
            <div class="y-axis-container">
              <div class="y-axis-title">Kilograms</div>
              <div class="y-axis"></div>
            </div>
            <div class="bar-chart">
              <div class="bar" data-month="Jan"></div>
              <div class="bar" data-month="Feb"></div>
              <div class="bar" data-month="Mar"></div>
              <div class="bar" data-month="Apr"></div>
              <div class="bar" data-month="May"></div>
              <div class="bar" data-month="Jun"></div>
              <div class="bar" data-month="Jul"></div>
              <div class="bar" data-month="Aug"></div>
              <div class="bar" data-month="Sep"></div>
              <div class="bar" data-month="Oct"></div>
              <div class="bar" data-month="Nov"></div>
              <div class="bar" data-month="Dec"></div>
            </div>
          </div>
          <div class="x-axis-title">Months</div>
        </div>
      </div>
    </div>

  </div> <!-- ✅ closes .main-content -->

  <!-- Import the reusable script from src/auth -->
  <script type="module" src="/src/auth/header.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
